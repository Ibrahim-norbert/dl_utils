[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl_utils"
version = "0.1.0"
description = "Shared deep-learning utilities (sample types, datasets, analysis, visualisations) for the SuperRes / SMLM projects."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ibrahim Norbert Mansaray" }]
# Runtime deps are intentionally kept light here; the heavy ML stack
# (torch, pytorch_lightning, etc.) is provided by the host environment.
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/Ibrahim-norbert/dl_utils"

# The package is "flat": its modules live in the repository root rather than in a
# nested ``dl_utils/`` directory. Map the import package ``dl_utils`` to ``.`` so
# ``pip install .`` / ``pip install -e .`` exposes ``import dl_utils`` correctly.
[tool.setuptools]
packages = ["dl_utils"]

[tool.setuptools.package-dir]
dl_utils = "."
